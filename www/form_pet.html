<section class="form-section">
    <h2> Cadastrar / Editar Pet</h2>

    <form action="index.html" method="POST" class="pet-form">
        
        <div class="form-group">
            <label for="nome"> Nome do Pet</label>
            <input type="text" id="nome" name="nome" required placeholder="Ex: Tito, Amora...">
        </div>

        <div class="form-group">
            <label for="nascimento"> Data de Nascimento</label>
            <input type="date" id="nascimento" name="nascimento" required>
        </div>

        <div class="form-group">
            <label for="especie_id"> Espécie</label>
            <select id="especie_id" name="especie_id" required>
                <option value=""> Selecione uma espécie </option>
                <option value="1">Cachorro</option>
                <option value="2"> Gato</option>
            </select>
        </div>

        <div class="form-group">
            <label> Gênero </label>
            <div class="radio-options">
                <label><input type="radio" name="genero" value="macho" required> Macho</label>
                <label><input type="radio" name="genero" value="femea" required> Fêmea </label>
            </div>
        </div>

        <div class="form-group">
            <label for="prontuario">Prontuário (Histórico Médico/Observações)</label>
            <textarea id="prontuario" name="prontuario" rows="4" placeholder="Insira informações de saúde, vacinas ou alergias do animal"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="botao-salvar"> Salvar Pet</button>
            <a href="index.html" class="botao-cancelar">Cancelar</a>
        </div>

    </form>
</section>
